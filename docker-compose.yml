# Spins up a Chord cluster:
#   3 compute nodes + 1 client
#
#   docker compose up --build
#
# compute0 forms the ring; compute1/compute2 join by bootstrapping through it.
# The client pushes the training shards into the ring, waits for local training,
# aggregates the models with FedAvg, and prints a validation error.

x-app: &app
  build: .
  networks:
    - chord

services:
  compute0:
    <<: *app
    hostname: compute0
    # first node: no bootstrap peer, forms the ring alone
    command: python compute_server.py compute0 9000

  compute1:
    <<: *app
    hostname: compute1
    # small delay so compute0 is listening before we bootstrap through it
    command: sh -c "sleep 4 && python compute_server.py compute1 9001 compute0 9000"
    depends_on: [compute0]

  compute2:
    <<: *app
    hostname: compute2
    command: sh -c "sleep 6 && python compute_server.py compute2 9002 compute0 9000"
    depends_on: [compute0]

  client:
    <<: *app
    # entry nodes are tried in order until one answers
    command: sh -c "sleep 12 && python client.py compute0 9000 compute1 9001 compute2 9002"
    depends_on: [compute0, compute1, compute2]

networks:
  chord:
