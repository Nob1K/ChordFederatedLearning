# Runs the whole cluster: 3 compute nodes and one client.
#
# Normal run:
#   docker compose up --build
# compute0 starts the ring, compute1 and compute2 join through it, then the
# client sends the shards, waits for training, averages the models, and prints
# a validation error (around 0.29).
#
# Kill-a-node demo:
#   ./demo/docker-chaos.sh
#
# Each node picks its own id from its hostname, so there is no separate
# coordinator. The healthchecks below just wait until a node's port is open
# before the next thing starts

x-app: &app
  build: .
  networks:
    - chord

services:
  compute0:
    <<: *app
    hostname: compute0
    command: python compute_server.py compute0 9000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9000), 1)"]
      interval: 2s
      timeout: 2s
      retries: 20

  compute1:
    <<: *app
    hostname: compute1
    command: python compute_server.py compute1 9001 compute0 9000
    depends_on:
      compute0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9001), 1)"]
      interval: 2s
      timeout: 2s
      retries: 20

  compute2:
    <<: *app
    hostname: compute2
    command: python compute_server.py compute2 9002 compute0 9000
    depends_on:
      compute0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9002), 1)"]
      interval: 2s
      timeout: 2s
      retries: 20

  client:
    <<: *app
    command: python client.py compute0 9000 compute1 9001 compute2 9002
    depends_on:
      compute0:
        condition: service_healthy
      compute1:
        condition: service_healthy
      compute2:
        condition: service_healthy

networks:
  chord:
